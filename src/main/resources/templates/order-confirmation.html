<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Order Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);">
    <h2 style="color: #4CAF50; text-align: center;">Thank You for Your Order!</h2>
    <p>Hi <strong th:text="${userName}"></strong>,</p>
    <p>We appreciate your purchase. Below are your order details:</p>

    <div style="background: #f9f9f9; padding: 10px; border-radius: 5px;">
        <p><strong>Order ID:</strong> <span th:text="${orderId}"></span></p>
        <p><strong>Date:</strong> <span th:text="${orderDate}"></span></p>
        <p><strong>Total Amount:</strong> Rs <span th:text="${totalAmount}"></span></p>
    </div>

    <h3>Ordered Items:</h3>
    <ul>
        <li th:each="item : ${items}">
            <strong th:text="${item.product}"></strong> - <span th:text="${item.brand}"></span> (Rs <span th:text="${item.price}"></span>)
        </li>
    </ul>

    <p>Your order will be delivered soon. If you have any questions, feel free to contact us.</p>

    <center>
        <a href="#" style="display: inline-block; background-color: #4CAF50; color: white; padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold;">Track Your Order</a>
    </center>

    <p style="text-align: center; font-size: 12px; color: #888;">Thank you for shopping with us! 🛍️</p>
</div>
</body>
</html>
